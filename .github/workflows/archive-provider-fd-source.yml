name: Archive provider application FD source boundary

on:
  pull_request:
    branches: [unstable, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fd-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DJANGO_SETTINGS_MODULE: tests.settings
    steps:
      - name: Checkout archive source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require non-root source test identity
        run: |
          test "$(id -u)" -ne 0
          test "$(id -g)" -ne 0
      - name: Checkout pinned canonical host-identify
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: zog144/host-identify
          ref: 59dbc181f54c6ac29ee5eb1f83b6f322fb73c037
          path: .ci-host-identify
          persist-credentials: false
      - name: Verify exact companion
        run: test "$(git -C .ci-host-identify rev-parse HEAD)" = 59dbc181f54c6ac29ee5eb1f83b6f322fb73c037
      - name: Install source-only dependencies
        run: |
          python -m pip install "setuptools==82.0.1" "wheel==0.45.1"
          python -m pip install --no-build-isolation ./.ci-host-identify .
          python -m pip check
      - name: Compile FD adapter and tests
        run: python -m compileall -q src/zog/archive_mirror/provider_fd_adapter.py src/zog/archive_mirror/provider_credentials.py tests/test_provider_fd_adapter.py
      - name: Synthetic Linux SCM_RIGHTS and separate-process tests without skips
        run: |
          python - <<'PY'
          import os
          import django
          from django.test.runner import DiscoverRunner
          assert os.geteuid() != 0 and os.getegid() != 0
          django.setup()
          class NoSkipped(DiscoverRunner):
              def suite_result(self, suite, result, **kwargs):
                  return super().suite_result(suite, result, **kwargs) + len(result.skipped)
          raise SystemExit(NoSkipped(verbosity=2).run_tests(["tests.test_provider_fd_adapter"]))
          PY

# No root service, real credential, mounted STATE, app grant, socket listener,
# native witness or privileged environment is exercised or accepted.
